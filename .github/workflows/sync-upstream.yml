name: Sync From Upstream

on:
  schedule:
    - cron: '0 2 * * *'      # 每天 UTC 02:00（北京时间 10:00）自动同步
  workflow_dispatch: {}      # 可在 Actions 页面手动立即触发

permissions:
  contents: write

concurrency:
  group: sync-from-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (PAT so workflow files can be pushed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Sync all upstream branches
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 上游地址（yetone/magpie）
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch --prune upstream '+refs/heads/*:refs/remotes/upstream/*'

          DEFAULT="main"

          for ref in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/upstream); do
            [ "$ref" = "HEAD" ] && continue

            if [ "$ref" = "$DEFAULT" ]; then
              # 默认分支：合并上游，保住本同步工作流文件
              echo "==> $ref: merge upstream (keep sync workflow)"
              git checkout -B "$ref" "origin/$ref"
              git merge --no-edit "upstream/$ref"
              git push origin "$ref"
            else
              # 其他分支：完全镜像上游
              echo "==> $ref: exact mirror"
              git push origin "refs/remotes/upstream/$ref:refs/heads/$ref" --force
            fi
          done

          echo "All upstream branches processed."
